name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Julia tests and Aqua
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      JULIA_NUM_THREADS: '2,0'
      JULIA_NUM_PRECOMPILE_TASKS: '2'
      JULIA_PKG_USE_CLI_GIT: 'true'
      JULIA_CONDAPKG_BACKEND: 'Null'
      PYTHONDONTWRITEBYTECODE: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.13'
      - uses: julia-actions/cache@v3
        with:
          delete-old-caches: 'false'
      - name: Install public dependencies
        run: |
          python -m pip install 'numpy==2.5.5'
          echo "JULIA_PYTHONCALL_EXE=$(command -v python)" >> "$GITHUB_ENV"
          git config --global url.https://github.com/.insteadOf git@github.com:
          julia --startup-file=no --project=. -e '
            using Pkg
            Pkg.Registry.add("General")
            Pkg.Registry.add(url="https://github.com/DarrylGamroth/PackageRegistry.git")
            Pkg.instantiate()'
      - name: Test on an isolated PipeWire core
        run: julia --startup-file=no --project=. -e 'using Pkg; Pkg.test(; coverage=true)'
      - uses: julia-actions/julia-processcoverage@v1
        with:
          directories: src
      - name: Require line coverage above 90%
        run: python .github/check_coverage.py lcov.info
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: lcov.info
          if-no-files-found: error

  coverage:
    name: Upload coverage to Codecov
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: coverage
      - uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          disable_search: true
          use_oidc: true
          fail_ci_if_error: true
